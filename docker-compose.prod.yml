# ============================================================
# Skillmate AI — Docker Compose PRODUCTION Overrides
# ============================================================
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# This file overrides the base docker-compose.yml with:
#   - restart: always (not unless-stopped)
#   - No published ports for postgres/redis (internal only)
#   - Production env (ENV=production, DEBUG=false)
#   - Resource limits
#   - Log rotation
# ============================================================

services:
  # ── PostgreSQL — Production Overrides ─────────────────────────
  postgres:
    restart: always
    ports: []  # Do NOT expose DB port externally in production
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in production}
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # ── Redis — Production Overrides ──────────────────────────────
  redis:
    restart: always
    ports: []  # Internal only
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ── FastAPI Backend — Production Overrides ─────────────────────
  backend:
    restart: always
    ports: []  # Nginx handles external traffic
    environment:
      ENV: production
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required in production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-skillmate}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-skillmate}
      SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL is required in production}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?SUPABASE_ANON_KEY is required in production}
      ALLOW_DEV_MOCK_AUTH: "false"
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required in production}
      CORS_ORIGINS: '["${FRONTEND_URL}"]'
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
        reservations:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "10"

  # ── Next.js Frontend — Production Overrides ────────────────────
  frontend:
    restart: always
    build:
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?NEXT_PUBLIC_SUPABASE_URL is required}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?NEXT_PUBLIC_SUPABASE_ANON_KEY is required}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/python}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:?NEXT_PUBLIC_WS_URL is required}
    ports: []  # Nginx handles external traffic
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # ── Nginx Reverse Proxy ────────────────────────────────────────
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: skillmate-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:?DOMAIN_NAME is required in production}
      SSL_MODE: ${SSL_MODE:-on}
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - skillmate-network

# ── Additional Production Volumes ──────────────────────────────
volumes:
  certbot_webroot:
    driver: local
  letsencrypt:
    driver: local
