# ============================================================
# Skillmate AI — CI Pipeline
# ============================================================
# Triggered on every push/PR to main.
# Jobs:
#   1. backend-checks  → pip install, ruff lint, pytest
#   2. frontend-checks → npm install, eslint, next build
#   3. docker-build    → build images (push to ghcr.io on main only)
#   4. deploy          → SSH deploy to production (main push only)
#
# Required secrets:  see DEPLOYMENT.md
# ============================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  checks: write
  pull-requests: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/skillmate-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/skillmate-frontend

# ============================================================
jobs:
# ============================================================

  # ──────────────────────────────────────────────────────────
  # JOB 1: Backend — lint + test
  # ──────────────────────────────────────────────────────────
  backend-checks:
    name: 🐍 Backend Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest-cov

      - name: Ruff lint
        run: ruff check . --output-format=github

      - name: Ruff format check
        run: ruff format --check .
        continue-on-error: true  # warn but don't fail on format

      - name: Create test .env
        run: |
          cat > .env << 'EOF'
          ENV=test
          DEBUG=false
          DATABASE_URL=sqlite:///file::memory:?cache=shared
          SUPABASE_URL=https://placeholder.supabase.co
          SUPABASE_ANON_KEY=placeholder
          ALLOW_DEV_MOCK_AUTH=true
          SECRET_KEY=ci-test-secret-key
          EOF

      - name: Run pytest
        run: |
          pytest tests/ \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --junitxml=test-results.xml \
            -v --tb=short \
            -x  # stop on first failure

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: |
            backend/coverage.xml
            backend/test-results.xml
          retention-days: 14

  # ──────────────────────────────────────────────────────────
  # JOB 2: Frontend — lint + type-check + build
  # ──────────────────────────────────────────────────────────
  frontend-checks:
    name: ⚡ Frontend Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: skillmate-frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: skillmate-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: ESLint
        run: npm run lint
        continue-on-error: true  # warn but don't block if lint script missing

      - name: TypeScript type-check
        run: npx tsc --noEmit
        continue-on-error: false

      - name: Build Next.js
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-key
          NEXT_PUBLIC_API_BASE_URL: /api/python
          NEXT_PUBLIC_WS_URL: ws://localhost:8000
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Verify standalone build
        run: |
          if [ -f ".next/standalone/server.js" ]; then
            echo "✅ Standalone build verified"
          else
            echo "⚠️ standalone/server.js not found (may use different output mode)"
          fi

  # ──────────────────────────────────────────────────────────
  # JOB 3: Docker Build & Push (main only)
  # ──────────────────────────────────────────────────────────
  docker-build:
    name: 🐳 Docker Build & Push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend-checks, frontend-checks]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:sha-${{ github.sha }}
          cache-from: type=registry,ref=${{ env.BACKEND_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.BACKEND_IMAGE }}:buildcache,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./skillmate-frontend
          file: ./skillmate-frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:sha-${{ github.sha }}
          cache-from: type=registry,ref=${{ env.FRONTEND_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.FRONTEND_IMAGE }}:buildcache,mode=max
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_API_BASE_URL=/api/python
            NEXT_PUBLIC_WS_URL=wss://${{ secrets.SERVER_HOST }}

      - name: Build summary
        run: |
          echo "## 🐳 Docker Images Pushed" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Tag |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | \`sha-${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | \`sha-${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY

  # ──────────────────────────────────────────────────────────
  # JOB 4: Deploy to Production (main push only)
  # ──────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [docker-build]

    environment:
      name: production
      url: https://${{ secrets.SERVER_HOST }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy via SSH
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=yes "$SERVER_USER@$SERVER_HOST" << 'ENDSSH'
            set -e
            echo "🚀 Deploying Skillmate AI..."

            cd /opt/skillmate

            # Pull latest images
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
              -u "${{ github.actor }}" --password-stdin

            docker compose pull backend frontend

            # Rolling restart (no rebuild on server)
            docker compose up -d --no-deps --no-build backend frontend

            # Run migrations
            docker compose exec -T backend alembic upgrade head 2>/dev/null || true

            # Cleanup old images
            docker image prune -f --filter "until=72h"

            echo "✅ Deploy complete"
          ENDSSH

      - name: Health check
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          ssh "$SERVER_USER@$SERVER_HOST" << 'ENDSSH'
            for i in $(seq 1 12); do
              if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
                echo "✅ Backend healthy"
                exit 0
              fi
              echo "⏳ Attempt $i/12..."
              sleep 5
            done
            echo "❌ Health check failed"
            docker compose logs --tail=30 backend
            exit 1
          ENDSSH

      - name: Deploy summary
        if: always()
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" == "success" ]; then
            echo "## ✅ Deployment Succeeded" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${GITHUB_SHA:0:7}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Actor | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
