# ============================================================
# Skillmate AI — CI/CD Pipeline
# ============================================================
# Jobs:
#   test-backend   → pytest + coverage (Python 3.11)
#   test-frontend  → lint + build (Node 20)
#   docker-build   → build & push to ghcr.io (main only)
#   deploy         → SSH deploy (after docker-build, main only)
#
# Required Secrets (Settings → Secrets → Actions):
#   SUPABASE_URL          — Supabase project URL
#   SUPABASE_ANON_KEY     — Supabase anon key
#   ANTHROPIC_API_KEY     — Anthropic Claude API key
#   GROQ_API_KEY          — Groq API key
#   STRIPE_SECRET_KEY     — Stripe secret key
#   NEXT_PUBLIC_SUPABASE_URL      — Frontend Supabase URL
#   NEXT_PUBLIC_SUPABASE_ANON_KEY — Frontend Supabase anon key
#   DEPLOY_SSH_KEY        — Private SSH key for deploy server
#   DEPLOY_HOST           — Deploy server hostname or IP
#   DEPLOY_USER           — SSH username (default: ubuntu)
#   DEPLOY_PATH           — Absolute path on server (default: /opt/skillmate)
# ============================================================

name: Skillmate AI CI/CD

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:  # Allow manual triggers from the GitHub UI

# Cancel in-flight runs for the same branch/PR to save CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Restrict default token permissions (principle of least privilege)
permissions:
  contents: read
  packages: write     # Needed to push to ghcr.io
  checks: write       # Needed for test-reporter annotations
  pull-requests: write  # Needed for coverage comment on PRs

env:
  REGISTRY: ghcr.io
  # Image names: ghcr.io/<owner>/<repo>-backend / -frontend
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/skillmate-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/skillmate-frontend
  # Coverage threshold (fail if below this)
  COVERAGE_THRESHOLD: 70

# ============================================================
jobs:
# ============================================================

  # ──────────────────────────────────────────────────────────
  # JOB 1: Backend Tests
  # ──────────────────────────────────────────────────────────
  test-backend:
    name: 🐍 Backend Tests (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov coverage[toml]

      - name: Create test environment file
        run: |
          cat > .env << EOF
          ENV=test
          DEBUG=false
          DATABASE_URL=sqlite:///file::memory:?cache=shared
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
          ALLOW_DEV_MOCK_AUTH=true
          SECRET_KEY=ci-test-secret-key-do-not-use-in-production
          EOF

      - name: Run pytest with coverage
        run: |
          pytest tests/ \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=${{ env.COVERAGE_THRESHOLD }} \
            --junitxml=test-results.xml \
            -v \
            --tb=short

      - name: Upload coverage report to Codecov
        if: always()  # Upload even if tests fail, for partial coverage info
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false  # Don't fail CI if Codecov upload fails

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: backend/test-results.xml
          check_name: Backend Test Results
          comment_mode: always

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/coverage.xml
          retention-days: 14

  # ──────────────────────────────────────────────────────────
  # JOB 2: Frontend Tests & Build
  # ──────────────────────────────────────────────────────────
  test-frontend:
    name: ⚡ Frontend Tests (Node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: skillmate-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: skillmate-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Run ESLint
        run: npm run lint

      - name: Type-check TypeScript
        run: npx tsc --noEmit
        continue-on-error: false  # Fail on type errors

      - name: Build Next.js application
        env:
          # Build-time public vars (not real keys — build just needs them set)
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          NEXT_PUBLIC_API_BASE_URL: /api/python
          NEXT_PUBLIC_WS_URL: wss://skillmate.ai
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Check build output (standalone)
        run: |
          if [ ! -f ".next/standalone/server.js" ]; then
            echo "❌ ERROR: .next/standalone/server.js not found."
            echo "   Ensure next.config.ts has output: 'standalone'"
            exit 1
          fi
          echo "✅ Standalone build verified at .next/standalone/server.js"

      - name: Upload Next.js build cache
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build-cache
          path: |
            skillmate-frontend/.next/cache
          retention-days: 7

  # ──────────────────────────────────────────────────────────
  # JOB 3: Docker Build & Push to GHCR
  # Runs only on push to main (not on PRs)
  # Depends on BOTH test jobs passing first
  # ──────────────────────────────────────────────────────────
  docker-build:
    name: 🐳 Docker Build & Push
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Only push images on direct pushes to main — not on PRs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    needs:
      - test-backend
      - test-frontend

    outputs:
      # Pass the exact image tags downstream to the deploy job
      backend-tag: ${{ steps.meta-backend.outputs.tags }}
      frontend-tag: ${{ steps.meta-frontend.outputs.tags }}
      image-digest-backend: ${{ steps.build-backend.outputs.digest }}
      image-digest-frontend: ${{ steps.build-frontend.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Build context for Docker can be large — set up QEMU for multi-platform
      - name: Set up QEMU (multi-platform support)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Backend Image Metadata ─────────────────────────────
      - name: Extract backend Docker metadata
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            # Tag with git SHA (immutable, for deploy pinning)
            type=sha,prefix=sha-,format=short
            # Tag with branch name
            type=ref,event=branch
            # Tag 'latest' only on main
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=Skillmate AI Backend
            org.opencontainers.image.description=FastAPI backend for Skillmate AI
            org.opencontainers.image.vendor=Skillmate AI

      # ── Frontend Image Metadata ────────────────────────────
      - name: Extract frontend Docker metadata
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=Skillmate AI Frontend
            org.opencontainers.image.description=Next.js frontend for Skillmate AI
            org.opencontainers.image.vendor=Skillmate AI

      # ── Build & Push Backend ───────────────────────────────
      - name: Build and push backend image
        id: build-backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          platforms: linux/amd64
          # Layer cache from previous runs (ghcr.io cache backend)
          cache-from: type=registry,ref=${{ env.BACKEND_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.BACKEND_IMAGE }}:buildcache,mode=max

      # ── Build & Push Frontend ─────────────────────────────
      - name: Build and push frontend image
        id: build-frontend
        uses: docker/build-push-action@v6
        with:
          context: ./skillmate-frontend
          file: ./skillmate-frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=registry,ref=${{ env.FRONTEND_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.FRONTEND_IMAGE }}:buildcache,mode=max
          # Inject NEXT_PUBLIC_* vars as build args
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_API_BASE_URL=/api/python
            NEXT_PUBLIC_WS_URL=wss://${{ secrets.DEPLOY_HOST }}

      - name: Image build summary
        run: |
          echo "## 🐳 Docker Images Built" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Digest |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| \`skillmate-backend:latest\` | \`${{ steps.build-backend.outputs.digest }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`skillmate-frontend:latest\` | \`${{ steps.build-frontend.outputs.digest }}\` |" >> $GITHUB_STEP_SUMMARY

  # ──────────────────────────────────────────────────────────
  # JOB 4: Deploy to Production Server via SSH
  # Runs only after docker-build succeeds on main
  # ──────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Gate: only run on main, only after docker-build succeeds
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - docker-build

    # Protect deployments with a GitHub Environment (optional, but recommended)
    # Create an "production" environment in Settings → Environments
    environment:
      name: production
      url: https://${{ secrets.DEPLOY_HOST }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add server to known_hosts
        run: |
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy via SSH
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'ubuntu' }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/skillmate' }}
          GITHUB_SHA_SHORT: ${{ github.sha }}
          BACKEND_IMAGE: ${{ env.BACKEND_IMAGE }}
          FRONTEND_IMAGE: ${{ env.FRONTEND_IMAGE }}
        run: |
          ssh -o StrictHostKeyChecking=yes \
              "$DEPLOY_USER@$DEPLOY_HOST" << ENDSSH

            set -e  # Exit on any error
            echo "🚀 Starting deployment of commit ${GITHUB_SHA_SHORT:0:7}"

            # Navigate to project directory
            cd "$DEPLOY_PATH"

            # Log in to GHCR on the remote server
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
              -u "${{ github.actor }}" \
              --password-stdin

            # Pull the newly built images (tagged :latest)
            docker compose pull

            # Start new containers with zero-downtime rolling restart
            # --no-build: use pulled images, don't rebuild on server
            # --remove-orphans: clean up any stale service containers
            docker compose -f docker-compose.yml -f docker-compose.prod.yml \
              up -d \
              --no-build \
              --remove-orphans

            # Run database migrations in the new backend container
            docker compose exec -T backend alembic upgrade head

            # Prune old images to free disk space (keep last 3)
            docker image prune -f --filter "until=72h"

            echo "✅ Deployment complete for commit ${GITHUB_SHA_SHORT:0:7}"

          ENDSSH

      - name: Verify deployment health
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'ubuntu' }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" << ENDSSH
            # Wait for backend to become healthy (max 60 seconds)
            echo "⏳ Waiting for backend health check..."
            for i in {1..12}; do
              if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
                echo "✅ Backend is healthy"
                exit 0
              fi
              echo "   Attempt $i/12 — waiting 5s..."
              sleep 5
            done
            echo "❌ Backend health check failed after 60 seconds"
            docker compose logs --tail=50 backend
            exit 1
          ENDSSH

      - name: Post deployment summary
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "## ✅ Deployment Succeeded" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered by** | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Backend Image** | \`${{ env.BACKEND_IMAGE }}:latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Frontend Image** | \`${{ env.FRONTEND_IMAGE }}:latest\` |" >> $GITHUB_STEP_SUMMARY
