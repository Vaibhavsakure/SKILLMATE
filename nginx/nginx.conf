# ============================================================
# Skillmate AI — Nginx Config (LOCAL DEV — HTTP only)
# ============================================================
# This file is used directly only if you run nginx outside
# of Docker (e.g. local binary). In Docker, the entrypoint
# renders nginx.conf.template with envsubst instead.
#
# For production, set:
#   DOMAIN_NAME=skillmate.ai
#   SSL_MODE=on
# and run via docker-compose.certbot.yml
# ============================================================

limit_req_zone $binary_remote_addr zone=skillmate_limit:10m rate=1r/s;

upstream frontend { server frontend:3000; }
upstream backend  { server backend:8000;  }

server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # ACME challenge (for certbot webroot — works even on dev)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml image/svg+xml font/woff2;

    client_max_body_size 20M;
    limit_req zone=skillmate_limit burst=20 nodelay;
    limit_req_status 429;

    location /ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /health    { proxy_pass http://backend; proxy_set_header Host $host; }
    location /docs      { proxy_pass http://backend; proxy_set_header Host $host; }
    location /openapi.json { proxy_pass http://backend; proxy_set_header Host $host; }

    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /_next/static/ {
        proxy_pass http://frontend;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
