; pytest.ini uses INI syntax and requires a [pytest] section.
; This file previously held the [tool.pytest.ini_options] TOML table, which
; only works inside pyproject.toml — pytest ignored all of it, so asyncio_mode
; never took effect and every async test errored out.
[pytest]
testpaths = tests
asyncio_mode = auto
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
filterwarnings =
    ignore::DeprecationWarning
    ignore::sqlalchemy.exc.SAWarning
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
